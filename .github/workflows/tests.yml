# Unit tests on the Python floor (3.9) and a current release (3.12). No GPU and no llama-server:
# the live test (harness/tests/test_live.py) skips itself unless HARNESS_LIVE_URL is set.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.lock pytest
      - name: Unit tests
        run: python -m pytest harness/tests -q
      - name: Byte-compile harness and analysis
        # analysis/ may hold no Python yet (or not exist); compile only the directories present.
        run: |
          dirs=""
          for d in harness analysis; do
            if [ -d "$d" ]; then dirs="$dirs $d"; fi
          done
          python -m compileall -q $dirs
      - name: Lint (advisory until the existing findings are fixed)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .
